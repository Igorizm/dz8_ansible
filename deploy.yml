---
# ==========================================================
# STAGE 1: Build Environment Setup & Project Compilation
# ==========================================================
- name: Build Java project on Builder Node
  hosts: web                          # Target group name for Slave-1 from the inventory hosts file
  become: yes
  tasks:
    - name: 1. Install Java 17, Maven build tool, and Git
      apt:
        name:
          - openjdk-17-jdk
          - maven
          - git
        state: present
        update_cache: yes

    - name: 2. Clone Java application source code from Git
      git:
        repo: 'https://github.com/boxfuse/boxfuse-sample-java-war-hello' # Public sample Java project repository URL
        dest: /tmp/java_build_dir
        version: master
        force: yes

    - name: 2.5. Update Java Compiler Source in pom.xml
      replace:
        path: /tmp/java_build_dir/pom.xml
        regexp: '<source>1.6</source>'
        replace: '<source>1.8</source>'

    - name: 2.6. Update Java Compiler Target in pom.xml
      replace:
        path: /tmp/java_build_dir/pom.xml
        regexp: '<target>1.6</target>'
        replace: '<target>1.8</target>'

    - name: 2.7. Force stable maven-war-plugin version
      replace:
        path: /tmp/java_build_dir/pom.xml
        regexp: '<version>2.5</version>(\s*<configuration>)'
        replace: '<version>3.3.2</version>\1'

    - name: 3. Build project using Maven (compile into a .war file)
      command: mvn clean package
      args:
        chdir: /tmp/java_build_dir

    - name: 4. Download (Fetch) the compiled WAR artifact to the Master server
      fetch:
        src: /tmp/java_build_dir/target/hello-1.0.war
        dest: /tmp/compiled_app.war
        flat: yes

    - name: 5. Clean up temporary source code files from the Builder node
      file:
        path: /tmp/java_build_dir
        state: absent

# ==========================================================
# STAGE 2: Production Environment Setup & Deployment
# ==========================================================
- name: Deploy compiled application to Production Node
  hosts: db                           # Slave-2 (Production server)
  become: yes
  tasks:
    - name: 1. Install Java 17 Runtime and Tomcat web server
      apt:
        name:
          - openjdk-17-jre
          - tomcat9
        state: present
        update_cache: yes

    - name: 1.5. Fix Tomcat systemd sandbox permissions
      shell: |
        mkdir -p /etc/systemd/system/tomcat9.service.d
        echo -e "[Service]\nReadWritePaths=/var/lib/tomcat9/webapps/" > /etc/systemd/system/tomcat9.service.d/override.conf
        systemctl daemon-reload

    - name: 1.6. Explicitly set JAVA_HOME for Tomcat
      lineinfile:
        path: /etc/default/tomcat9
        regexp: '^#?JAVA_HOME='
        line: 'JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64'
    - name: 1.7. Remove default Tomcat webapps ROOT directory
      file:
        path: /var/lib/tomcat9/webapps/ROOT
        state: absent

    - name: 2. Copy the compiled WAR artifact from Master to Prod (Tomcat autodeploy directory)
      copy:
        src: /tmp/compiled_app.war
        dest: /var/lib/tomcat9/webapps/ROOT.war
        owner: tomcat
        group: tomcat
        mode: '0644'

    - name: 3. Ensure the Tomcat service is running and enabled on boot
      service:
        name: tomcat9
        state: restarted
        enabled: yes